name: CI

# Runs the checks docs/development.md lists: the skill validator, the loop
# contract check and the unit tests. Python standard library only.
on:
  push:
    branches:
      - main
  # No paths filter: a check skipped by a path filter stays Pending and blocks
  # the merge once it is a required check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    # Public repo: GitHub-hosted runners are free here, and the job runs on
    # pull requests, so it must never touch a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate the skill packages
        run: python3 scripts/validate_skills.py skills

      - name: Check the loops package the shared contract
        run: python3 scripts/validate_skills.py skills/*-loop --contract shared/loop-contract.md

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
